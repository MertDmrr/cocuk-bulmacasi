<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çocuk Bulmacası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: neşeli, sade, çocuk oyunu
   IDEA: deniz altında bir oyun konsolu çerçevesi
   PICTURE: oyunun kendisi, ekranın ortasında 16:9
   COLOUR and TYPE: deniz turkuazı zemin, mercan vurgusu; Baloo 2
   LAYOUT: üstte küçük başlık, ortada oyun, altta kısa ipucu */
:root{color-scheme:light dark;--bg:light-dark(#bfe9ef,#0e3b46);--ink:light-dark(#0d3a44,#e6f8fb);--kart:light-dark(#ffffff,#123f4a);--vurgu:#ff7a59;--golge:light-dark(rgba(13,58,68,.25),rgba(0,0,0,.5))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Baloo 2",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;
  background-image:radial-gradient(circle at 12% 88%,rgba(255,255,255,.35) 0 6px,transparent 7px),radial-gradient(circle at 85% 20%,rgba(255,255,255,.3) 0 9px,transparent 10px),radial-gradient(circle at 70% 75%,rgba(255,255,255,.25) 0 5px,transparent 6px)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px max(3vw,14px)}
h1{margin:0;font-size:clamp(22px,3.2vw,34px);font-weight:800;line-height:1.05;letter-spacing:.2px}
h1 span{color:var(--vurgu)}
button{font:inherit;font-weight:600;font-size:16px;min-height:44px;padding:0 18px;border:0;border-radius:22px;background:var(--vurgu);color:#fff;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.18)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
main{flex:1;display:grid;place-items:center;padding:0 max(2vw,10px)}
.cerceve{position:relative;width:min(100%,calc((100vh - 130px)*16/9));aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#d6f3f2;box-shadow:0 14px 40px var(--golge),0 0 0 6px var(--kart)}
#unity-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#d6f3f2}
.yukleme{position:absolute;inset:0;display:grid;place-content:center;gap:14px;text-align:center;background:linear-gradient(#e9fbfb,#bfe9ef);color:#0d3a44}
.yukleme b{font-size:clamp(20px,3vw,30px)}
.cubuk{width:min(60vw,360px);height:18px;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 3px #0d3a44;overflow:hidden}
.cubuk i{display:block;height:100%;width:0;background:var(--vurgu);transition:width .2s}
.hata{position:absolute;left:12px;right:12px;bottom:12px;padding:10px 14px;border-radius:12px;background:#fff3f0;color:#8a2b12;font-size:15px;display:none}
footer{padding:8px max(3vw,14px) 12px;font-size:14px;opacity:.85;text-align:center}
@media (prefers-reduced-motion:reduce){.cubuk i{transition:none}}
@media (max-width:600px){header{padding:8px 12px}button{padding:0 14px}}
</style>
</head>
<body>
<header>
  <h1>Çocuk <span>Bulmacası</span></h1>
  <button id="tamEkran" type="button">Tam ekran</button>
</header>
<main>
  <div class="cerceve" id="cerceve">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div class="yukleme" id="yukleme">
      <b>Oyun yükleniyor…</b>
      <div class="cubuk"><i id="ilerleme"></i></div>
      <small id="durum">İlk açılış biraz sürebilir</small>
    </div>
    <div class="hata" id="hata"></div>
  </div>
</main>
<footer>Nesneleri sürükleyip doğru gölgenin üstüne bırak. Sesi duymak için önce ekrana bir kez dokun.</footer>
<script>
{
  const BOYUT = {
    "WebGL.wasm": { dosya: "Build/WebGL.wasm.gz", boyut: 50129246, tur: "application/wasm" },
    "WebGL.data": { dosya: "Build/WebGL.data.gz", boyut: 22677004, tur: "application/octet-stream" }
  };
  const TOPLAM = 12894813 + 13745489;
  const inen = {};
  const asilFetch = window.fetch.bind(window);
  const hataKutusu = document.getElementById("hata");
  const durum = document.getElementById("durum");
  const cubuk = document.getElementById("ilerleme");

  function hataGoster(mesaj) {
    hataKutusu.textContent = String(mesaj);
    hataKutusu.style.display = "block";
  }

  function indirmeGuncelle() {
    let say = 0;
    for (const k in inen) say += inen[k];
    const oran = Math.min(1, say / TOPLAM);
    cubuk.style.width = Math.round(85 * oran) + "%";
    durum.textContent = "İndiriliyor… " + (say / 1048576).toFixed(1) + " / " + (TOPLAM / 1048576).toFixed(1) + " MB";
  }

  // Büyük dosyalar gzip ile sıkıştırıldı; tarayıcıda açılıp Unity'ye veriliyor.
  async function sikistirilmisGetir(bilgi) {
    const cevap = await asilFetch(bilgi.dosya);
    if (!cevap.ok) throw new Error(bilgi.dosya + " indirilemedi (" + cevap.status + ")");
    const okuyucu = cevap.body.getReader();
    const parcalar = [];
    inen[bilgi.dosya] = 0;
    for (;;) {
      const { done, value } = await okuyucu.read();
      if (done) break;
      parcalar.push(value);
      inen[bilgi.dosya] += value.length;
      indirmeGuncelle();
    }
    const ham = new Uint8Array(await new Blob(parcalar).arrayBuffer());
    const gzipMi = ham[0] === 0x1f && ham[1] === 0x8b;
    const akis = gzipMi ? new Blob([ham]).stream().pipeThrough(new DecompressionStream("gzip")) : new Blob([ham]).stream();
    return new Response(akis, { headers: { "Content-Type": bilgi.tur, "Content-Length": String(bilgi.boyut) } });
  }

  window.fetch = function (girdi, ayar) {
    const adres = typeof girdi === "string" ? girdi : (girdi && girdi.url) || "";
    for (const ad in BOYUT) {
      if (adres.split("?")[0].endsWith(ad)) return sikistirilmisGetir(BOYUT[ad]);
    }
    return asilFetch(girdi, ayar);
  };

  const canvas = document.getElementById("unity-canvas");
  const config = {
    arguments: [],
    dataUrl: "Build/WebGL.data",
    frameworkUrl: "Build/WebGL.framework.js",
    codeUrl: "Build/WebGL.wasm",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Mert Demir",
    productName: "Çocuk Bulmacası",
    productVersion: "1.0",
    showBanner: function (mesaj, tur) { if (tur === "error") hataGoster(mesaj); }
  };

  let oyun = null;
  document.getElementById("tamEkran").addEventListener("click", () => {
    try {
      if (oyun) oyun.SetFullscreen(1);
      else document.getElementById("cerceve").requestFullscreen().catch(() => {});
    } catch (e) { /* tam ekran bu görünümde kapalı olabilir */ }
  });

  durum.textContent = "Dosyalar indiriliyor…";
  const yukleyici = document.createElement("script");
  yukleyici.src = "Build/WebGL.loader.js";
  yukleyici.onload = () => {
    createUnityInstance(canvas, config, (oran) => {
      if (oran >= 0.9) {
        cubuk.style.width = Math.round(85 + 15 * (oran - 0.9) / 0.1) + "%";
        durum.textContent = "Neredeyse hazır…";
      }
    }).then((ornek) => {
      oyun = ornek;
      document.getElementById("yukleme").style.display = "none";
    }).catch((mesaj) => {
      durum.textContent = "Oyun açılamadı";
      hataGoster(mesaj);
    });
  };
  yukleyici.onerror = () => hataGoster("Yükleyici dosyası açılamadı.");
  document.body.appendChild(yukleyici);
}
</script>
</body>
</html>
